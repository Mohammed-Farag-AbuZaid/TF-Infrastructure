<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Propose a Study Group — TF Connect</title>
  <meta name="description" content="Register a new regional STEM study chapter, Olympiad circle, or project guild in Egypt." />
  <meta name="theme-color" content="#F3F2EE" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%227%22%20fill%3D%22%231B365D%22%2F%3E%3Crect%20x%3D%2222%22%20y%3D%225%22%20width%3D%225%22%20height%3D%225%22%20rx%3D%221.5%22%20fill%3D%22%230F766E%22%2F%3E%3Cpath%20d%3D%22M6.8%209.5h11.4v2.7h-4.2V23h-3V12.2H6.8V9.5zm10.8%200H25v2.7h-4.4v2.9h3.8v2.6h-3.8V23h-3V9.5z%22%20fill%3D%22%23FFFFFF%22%2F%3E%3C%2Fsvg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --canvas: #F3F2EE;
      --well: #EAE8E1;
      --paper: #FFFFFF;
      --border: #DFDDD6;
      --primary: #1B365D;
      --primary-hover: #132847;
      --teal: #0F766E;
      --ink: #161A22;
      --slate: #525866;
      --muted: #767D8C;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--canvas);
      color: var(--ink);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    a { color: inherit; text-decoration: none; }
    .font-display { font-family: 'Bricolage Grotesque', -apple-system, sans-serif; }
    .container { max-width: 720px; margin: 0 auto; padding: 0 20px; width: 100%; }
    .inline-head {
      padding: 24px 0 20px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    .back-link { font-size: 13.5px; font-weight: 500; color: var(--primary); }
    .back-link:hover { text-decoration: underline; }
    .card {
      margin-top: 28px;
      margin-bottom: 64px;
      background: var(--paper);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 28px;
      box-shadow: 0 1px 2px rgba(22, 26, 34, 0.04);
    }
    label { display: block; font-size: 13px; font-weight: 500; color: var(--ink); margin-top: 16px; margin-bottom: 6px; }
    input, select, textarea {
      width: 100%; padding: 10px 12px; border-radius: 8px;
      background: rgba(234, 232, 225, 0.55); border: 1px solid var(--border);
      font-family: inherit; font-size: 14px; color: var(--ink); outline: none;
    }
    input:focus, select:focus, textarea:focus { background: var(--paper); border-color: var(--primary); }
    button[type="submit"] {
      margin-top: 20px; width: 100%; height: 42px; border-radius: 8px; border: none;
      background: var(--primary); color: #FFFFFF; font-size: 14px; font-weight: 600; cursor: pointer;
    }
    button[type="submit"]:hover { background: var(--primary-hover); }
    .alert {
      display: none; margin-top: 16px; padding: 12px 14px; border-radius: 8px;
      font-size: 13.5px; font-weight: 500; border: 1px solid var(--border);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="inline-head">
      <a href="/" class="back-link">← Back to chapters directory</a>
      <span style="font-size:12px;color:var(--muted);">TF Connect</span>
    </div>

    <section class="card">
      <div style="padding-left:10px;border-left:2px solid var(--teal);font-size:12.5px;color:var(--slate);font-weight:500;">
        Chapter registration
      </div>
      <h1 class="font-display" style="margin:10px 0 0;font-size:28px;letter-spacing:-0.02em;">Propose a regional study group</h1>
      <p style="margin:8px 0 0;font-size:14px;line-height:1.6;color:var(--slate);">
        Submit your school chapter, Olympiad peer circle, or engineering guild to be reviewed and listed in the TF Connect atlas.
      </p>

      <div id="form-alert" class="alert"></div>

      <form id="propose-form">
        <label for="group-name">Chapter or guild name</label>
        <input id="group-name" type="text" required placeholder="e.g. Mansoura Olympiad Physics Circle" />

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
          <div>
            <label for="group-type">Classification</label>
            <select id="group-type">
              <option value="School Chapter">School Chapter</option>
              <option value="Project Guild">Project Guild</option>
              <option value="Research Lab">Research Lab</option>
            </select>
          </div>
          <div>
            <label for="group-gov">Governorate</label>
            <input id="group-gov" type="text" required placeholder="e.g. Dakahlia" />
          </div>
        </div>

        <label for="group-desc">Focus areas &amp; meeting format</label>
        <textarea id="group-desc" rows="4" required placeholder="Describe topics covered, target student track, and how students can join..."></textarea>

        <button type="submit">Submit chapter proposal</button>
      </form>
    </section>
  </div>

  <script>
    const form = document.getElementById('propose-form');
    const alertBox = document.getElementById('form-alert');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.style.display = 'block';
      alertBox.style.background = '#EAE8E1';
      alertBox.style.color = '#161A22';
      alertBox.textContent = 'Submitting chapter proposal...';

      const name = document.getElementById('group-name').value.trim();
      const type = document.getElementById('group-type').value;
      const gov = document.getElementById('group-gov').value.trim();
      const desc = document.getElementById('group-desc').value.trim();

      try {
        const res = await fetch('https://n8n.tfunions.com/tf-api/api/qa-submit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            submissionType: 'Project_Idea',
            service: 'Connect_Portal',
            title: `[${type} · ${gov}] ${name}`,
            description: desc,
            pageUrl: window.location.href,
            uid: localStorage.getItem('tf_voter_id') || 'connect_visitor'
          })
        });
        if (!res.ok) throw new Error('Request failed');
        alertBox.style.background = '#EDF7F5';
        alertBox.style.borderColor = '#BCE3DC';
        alertBox.style.color = '#0F766E';
        alertBox.textContent = 'Proposal received. Our regional coordinators will review and publish it.';
        form.reset();
      } catch {
        alertBox.style.background = '#FEF2F2';
        alertBox.style.borderColor = '#FECACA';
        alertBox.style.color = '#B91C1C';
        alertBox.textContent = 'Could not submit chapter proposal. Please try again.';
      }
    });
  </script>
</body>
</html>
